name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check tag matches version in code
        run: |
          CODE_VERSION=$(grep -hoP 'const version\s*=\s*"\K[^"]+' *.go | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "code: $CODE_VERSION  tag: $TAG_VERSION"
          if [ "$CODE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $CODE_VERSION in the code"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "dist/gondola-${GITHUB_REF_NAME}-linux-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "dist/gondola-${GITHUB_REF_NAME}-linux-arm64" .
          cd dist && sha256sum * > checksums.txt
      - name: Create release if needed and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
