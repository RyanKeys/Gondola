name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build (linux/amd64)
        run: go build -o /tmp/gondola-amd64 .
      - name: Build (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build -o /tmp/gondola-arm64 .
